services:
  web:
    build: { context: ., target: web }
    ports: ['4200:80']
    volumes: ['./deploy/config.local.json:/usr/share/nginx/html/config.json:ro']
    depends_on: [api]
  api:
    build: { context: ., target: api }
    ports: ['3001:3001']
    environment:
      DATABASE_URL: postgresql://flowdesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/flowdesk
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET with 32+ characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD with 12+ characters}
      FRONTEND_URL: http://localhost:4200
      PORT: 3001
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_FROM: demo@example.com
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowdesk
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowdesk']
      interval: 5s
      retries: 20
  mail:
    image: axllent/mailpit:latest
    ports: ['8025:8025']
volumes:
  postgres:
