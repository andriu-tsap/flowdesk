databases:
  - name: flowdesk-db
    plan: free
services:
  - type: web
    name: flowdesk-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: flowdesk-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
